name: probe
on:
  push:
    branches: [probe-history]
    paths: [probe/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests==2.32.3 && python probe/probe.py
      - run: |
          git config user.name "probe[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe results" && git push -q
