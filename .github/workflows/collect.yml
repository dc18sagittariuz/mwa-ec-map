name: collect

on:
  schedule:
    - cron: "7,37 * * * *"   # ทุก 30 นาที (เลี่ยงนาทีที่ 0 ซึ่งคิวแน่น)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # เริ่มจาก commit ล่าสุดเสมอ (ไม่ใช่ commit ตอนสั่งรัน) กันชนกับรอบก่อนหน้า
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Collect and forecast
        run: python collector/run.py
      - name: Commit data
        run: |
          git config user.name "ec-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
