name: collect

on:
  schedule:
    - cron: "7,37 * * * *"   # ทุก 30 นาที (เลี่ยงนาทีที่ 0 ซึ่งคิวแน่น)
  workflow_dispatch:

permissions:
  contents: write
  issues: write     # health.py เปิด/ปิด issue แจ้งเตือน

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # เริ่มจาก commit ล่าสุดเสมอ (ไม่ใช่ commit ตอนสั่งรัน) กันชนกับรอบก่อนหน้า
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Collect and forecast
        id: collect
        run: python collector/run.py
      - name: Health check (open/close alert issues)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python collector/health.py collect
      - name: Commit data
        run: |
          git config user.name "ec-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
      # ตัวเฝ้าระวังภายนอก (ไม่บังคับ): ใส่ URL จาก healthchecks.io ใน Settings → Secrets → Actions ชื่อ HEALTHCHECKS_URL
      # ถ้าไม่ได้รับสัญญาณตามรอบ healthchecks.io จะส่งอีเมลเตือน — ครอบคลุมกรณี GitHub Actions ล่มทั้งระบบ
      - name: Ping healthchecks.io
        if: always()
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_URL }}
          OUTCOME: ${{ steps.collect.outcome }}
        run: |
          [ -z "$HC_URL" ] && exit 0
          if [ "$OUTCOME" = "success" ]; then curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL"; else curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL/fail"; fi
